name: HUMA X Multi-Platform Build & Mobile Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Linux x86-64 Build
  build-linux-x86_64:
    name: Build Linux x86-64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake
        run: cmake -B build -S huma_lang -DCMAKE_BUILD_TYPE=Release

      - name: Compile HUMA X
        run: cmake --build build --config Release -j4

      - name: Run Test Suite
        run: ./build/huma_test_suite

      - name: Rename Binary
        run: |
          mkdir -p release-bin
          cp build/huma release-bin/huma-linux-x86_64
          chmod +x release-bin/huma-linux-x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huma-linux-x86_64
          path: release-bin/huma-linux-x86_64

  # 2. Android Mobile (ARM64) Build with Android NDK
  build-android-arm64:
    name: Build Android Mobile (ARM64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Configure CMake for Android ARM64
        run: |
          cmake -B build-android -S huma_lang \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Android ARM64 Binary
        run: cmake --build build-android --target huma --config Release -j4

      - name: Prepare Android Binary & Termux Package
        run: |
          mkdir -p release-android
          cp build-android/huma release-android/huma-android-arm64
          chmod +x release-android/huma-android-arm64

          # Create Termux installer script
          cat << 'EOF' > release-android/install-termux.sh
          #!/data/data/com.termux/files/usr/bin/bash
          set -e
          echo "========================================="
          echo "  HUMA X Mobile Installer for Termux"
          echo "========================================="
          mkdir -p $PREFIX/bin
          cp huma-android-arm64 $PREFIX/bin/huma
          chmod +x $PREFIX/bin/huma
          echo "✓ Successfully installed huma to $PREFIX/bin/huma"
          echo "Run 'huma version' to test!"
          huma version
          EOF
          chmod +x release-android/install-termux.sh

          # Zip for easy mobile download
          zip -r release-android/huma-x-android-mobile.zip release-android/huma-android-arm64 release-android/install-termux.sh huma_lang/examples

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huma-android-mobile-arm64
          path: release-android/*

  # 3. Windows x64 Build
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S huma_lang -DCMAKE_BUILD_TYPE=Release

      - name: Compile HUMA X
        run: cmake --build build --config Release -j4

      - name: Prepare Windows Executable
        shell: bash
        run: |
          mkdir -p release-win
          cp build/Release/huma.exe release-win/huma-windows-x64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huma-windows-x64
          path: release-win/huma-windows-x64.exe

  # 4. macOS Universal Build
  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S huma_lang -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compile HUMA X
        run: cmake --build build --config Release -j4

      - name: Prepare macOS Binary
        run: |
          mkdir -p release-mac
          cp build/huma release-mac/huma-macos-universal
          chmod +x release-mac/huma-macos-universal

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huma-macos-universal
          path: release-mac/huma-macos-universal

  # 5. Create GitHub Release
  create-release:
    name: Publish GitHub Release with Mobile & Desktop Binaries
    needs: [build-linux-x86_64, build-android-arm64, build-windows-x64, build-macos]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Package Release Assets
        run: |
          mkdir -p final-release
          cp all-artifacts/huma-linux-x86_64/huma-linux-x86_64 final-release/
          cp all-artifacts/huma-windows-x64/huma-windows-x64.exe final-release/
          cp all-artifacts/huma-macos-universal/huma-macos-universal final-release/
          cp all-artifacts/huma-android-mobile-arm64/huma-android-arm64 final-release/
          cp all-artifacts/huma-android-mobile-arm64/huma-x-android-mobile.zip final-release/
          cp public/huma-mobile.html final-release/huma-mobile-offline-runner.html 2>/dev/null || true
          ls -la final-release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          name: "HUMA X v1.0.0 Release (Mobile & Desktop)"
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## 🚀 HUMA X v1.0.0 — Multi-Platform & Mobile Release

            ### 📱 মোবাইল (Android Phone / Termux) এ চালানোর উপায়:
            1. **পদ্ধতি ১ (অফলাইন ওয়েব রানার - সবচেয়ে সহজ):**
               - `huma-mobile-offline-runner.html` ফাইলটি ডাউনলোড করে আপনার মোবাইলের Chrome বা ব্রাউজারে খুলুন।
               - ইন্টারনেট ছাড়াই সম্পূর্ণ অফলাইনে মোবাইল দিয়ে কোড লিখুন ও রান করুন!
            2. **পদ্ধতি ২ (Termux এ আসল কম্পাইলার চালানো):**
               - Android এ Play Store / F-Droid থেকে **Termux** অ্যাপ ইনস্টল করুন।
               - `huma-x-android-mobile.zip` ডাউনলোড করুন বা Termux এ কমান্ড চালান:
                 ```bash
                 pkg update && pkg install -y clang cmake
                 git clone https://github.com/huma-lang/huma-x.git
                 cd huma-x/huma_lang
                 cmake -B build && cmake --build build -j4
                 cp build/huma $PREFIX/bin/
                 huma version
                 ```
            
            ### 💻 Desktop Binaries Download:
            - **Linux (x86-64):** `huma-linux-x86_64`
            - **Android Mobile (ARM64):** `huma-android-arm64` & `huma-x-android-mobile.zip`
            - **Windows (x64):** `huma-windows-x64.exe`
            - **macOS (Apple Silicon & Intel):** `huma-macos-universal`
            - **Mobile Offline Web Runner:** `huma-mobile-offline-runner.html`
